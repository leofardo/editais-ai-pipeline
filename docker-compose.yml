# Stack local do projeto:
#   - Airflow 2.10 (LocalExecutor): webserver + scheduler
#   - postgres-airflow: banco de metadados do Airflow
#   - pgvector: Postgres com extensão vector (usado na Fase 4 para o RAG)
#
# Uso:  docker compose up airflow-init  (primeira vez)
#       docker compose up -d

x-airflow-common: &airflow-common
  build: .
  image: editais-airflow:latest
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-troque-esta-chave}
    PYTHONPATH: /opt/airflow/src
    LANDING_DIR: /opt/airflow/data/landing
    LOCAL_LAKE_DIR: /opt/airflow/data/lake
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/credentials/gcp-sa.json
    PGVECTOR_HOST: pgvector
    PGVECTOR_PORT: "5432"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./credentials:/opt/airflow/credentials:ro
    - ./dbt:/opt/airflow/dbt
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres-airflow:
      condition: service_healthy

services:
  postgres-airflow:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${PGVECTOR_USER:-editais}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-editais}
      POSTGRES_DB: ${PGVECTOR_DB:-editais}
    ports:
      - "5433:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${PGVECTOR_USER:-editais}"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USER:-admin}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin --lastname User --role Admin \
          --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped

  # ---------------- Fase 6: API + MCP ----------------
  api:
    build: {context: ., dockerfile: Dockerfile.api}
    env_file: .env
    environment:
      PGVECTOR_HOST: pgvector
      PGVECTOR_PORT: "5432"
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/gcp-sa.json
    volumes:
      - ./credentials:/app/credentials:ro
    ports:
      - "8000:8000"   # API + Swagger em /docs
    depends_on:
      pgvector:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    build: {context: ., dockerfile: Dockerfile.api}
    env_file: .env
    environment:
      PGVECTOR_HOST: pgvector
      PGVECTOR_PORT: "5432"
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/gcp-sa.json
    volumes:
      - ./credentials:/app/credentials:ro
    command: ["python", "-m", "editais.api.mcp_server", "--http", "--port", "8001"]
    ports:
      - "8001:8001"   # MCP streamable-http em /mcp
    depends_on:
      pgvector:
        condition: service_healthy
    profiles: ["mcp"]  # sobe só com: docker compose --profile mcp up
    restart: unless-stopped

  # ---------------- Fase 7: chat ----------------
  ui:
    build: {context: ., dockerfile: Dockerfile.ui}
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-airflow-data:
  pgvector-data:
